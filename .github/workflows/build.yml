name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write     # een tag v* maakt een release met de builds erbij

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen   # tests hebben geen beeldscherm nodig
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux-systeembibliotheken voor Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Inno Setup voor de Windows-installatie
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Install Python-bibliotheken
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Zelfstandige versie bouwen
        run: python packaging/build.py

      - name: Nakijken wat er gebouwd is
        run: ls -l dist
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: Volura-${{ runner.os }}
          path: |
            dist/Volura-*.zip
            dist/Volura-*.tar.gz
            dist/Volura-*.exe
          if-no-files-found: error

      - name: Bij een release voegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Volura-*.zip
            dist/Volura-*.tar.gz
            dist/Volura-*.exe
