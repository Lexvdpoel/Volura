name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write     # a tag v* makes a release with the builds attached

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen   # tests need no display
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Inno Setup for the Windows installer
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Build the standalone version
        run: python packaging/build.py

      - name: Check what was built
        run: ls -l dist
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: Volura-${{ runner.os }}
          path: |
            dist/Volura-*.zip
            dist/Volura-*.tar.gz
            dist/Volura-*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Volura-*.zip
            dist/Volura-*.tar.gz
            dist/Volura-*.exe
