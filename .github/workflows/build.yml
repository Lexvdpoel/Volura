name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write     # a tag v* makes a release with the builds attached

jobs:
  build:
    # a release commit is pushed to main and then tagged: the tag builds and publishes it,
    # so the push of that commit to main does not build it a second time
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Release ')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen   # tests need no display
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Linux system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Inno Setup for the Windows installer
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Cache the slicer
        uses: actions/cache@v6
        with:
          path: curaengine
          key: curaengine-5.14.0-${{ runner.os }}-${{ hashFiles('tools/fetch_curaengine.py', 'tools/fetch_orca_profiles.py', 'volura/orca_gcode.py') }}

      - name: CuraEngine and the printer profiles for File > Slice
        continue-on-error: true      # without it the build works, only File > Slice says so
        shell: bash
        run: |
          if [ ! -f curaengine/VERSION ]; then python tools/fetch_curaengine.py; fi
          # the printers of OrcaSlicer's profiles that Cura does not have
          if [ ! -f curaengine/resources/ORCA_VERSION ]; then python tools/fetch_orca_profiles.py; fi

      - name: Tests
        run: python -m pytest -q -n auto tests     # spread over the cores of the runner

      - name: Build the standalone version
        run: python packaging/build.py

      - name: Check what was built
        run: ls -l dist
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: Volura-${{ runner.os }}
          path: |
            dist/Volura-*.zip
            dist/Volura-*.tar.gz
            dist/Volura-*.exe
          if-no-files-found: error

      - name: Release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # the section of CHANGELOG.md for this version: from its "## x.y.z" heading to the next
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > release_notes.md
          echo "" >> release_notes.md
          echo "All versions: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)" >> release_notes.md
          cat release_notes.md

      - name: Source of CuraEngine for the release (AGPL)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL -o dist/CuraEngine-5.14.0-source.tar.gz \
            https://github.com/Ultimaker/CuraEngine/archive/refs/tags/5.14.0.tar.gz

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            dist/Volura-*.zip
            dist/Volura-*.tar.gz
            dist/Volura-*.exe
            dist/CuraEngine-*-source.tar.gz
